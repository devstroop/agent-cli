name: Mirror

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Mirror to backup remote
        env:
          TOKEN: ${{ secrets.MIRROR_AUTH_TOKEN }}
          DEST: ${{ secrets.MIRROR_URL }}
        run: |
          git remote add mirror "https://${TOKEN}@${DEST#https://}"
          git push --force-with-lease --mirror mirror
