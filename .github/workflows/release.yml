name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    permissions:
      contents: write
    strategy:
      matrix:
        target:
          - x86_64-linux
          - aarch64-linux
          - x86_64-macos
          - aarch64-macos
          - x86_64-windows
          - aarch64-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"
      - run: zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSafe
      - name: Package (unix)
        if: ${{ !endsWith(matrix.target, '-windows') }}
        run: |
          cd zig-out/bin
          tar czf ../../agent-${{ matrix.target }}.tar.gz agent
      - name: Package (windows)
        if: ${{ endsWith(matrix.target, '-windows') }}
        run: |
          cd zig-out/bin
          zip ../../agent-${{ matrix.target }}.zip agent.exe
      - uses: softprops/action-gh-release@v2
        with:
          files: agent-${{ matrix.target }}.*
