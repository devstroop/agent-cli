name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"
      - run: zig build
      - run: zig build test

  integration:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6
      - uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"
      - name: Ensure test scripts are executable
        run: chmod +x tests/*.sh tests/*.py
      - name: Build project
        run: zig build
      - name: Run integration tests
        run: |
          bash tests/test.sh
        env:
          MOCK_PORT: 18899
